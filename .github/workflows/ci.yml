name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: yarn install --frozen-lockfile
      - name: Syntax check
        run: git ls-files '*.js' | xargs -n1 node --check
      - name: Migrations apply to a fresh database
        run: |
          printf 'DB_DRIVER=sqlite3\nDB_DATABASE=./lib/data/ci.sqlite\nSITE_DOMAIN=localhost\n' > .env
          ln -sfn ../lib node_modules/lib
          node_modules/.bin/knex migrate:latest
          node -e "require('./serverConfig.js')"
